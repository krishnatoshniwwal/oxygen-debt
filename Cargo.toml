[package]
name = "kopt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kopt_bin"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

# Offline test tool (not built by build.sh): cargo build --release --offline --features tools
[features]
tools = []

[[bin]]
name = "kfuzz"
path = "src/bin/kfuzz/main.rs"
required-features = ["tools"]
